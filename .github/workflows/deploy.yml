name: deploy

# Deploys the pipeline image to AWS once the infrastructure exists (infra/README.md). Skipped
# until the AWS_DEPLOY_ROLE_ARN repository variable is set; authenticates with OIDC, so no AWS
# keys are stored in GitHub.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: vars.AWS_DEPLOY_ROLE_ARN != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: aws
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build and push the arm64 pipeline image
        id: image
        run: |
          image="${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}"
          docker buildx build --platform linux/arm64 --provenance=false -f backend/lambdas/Dockerfile -t "$image" --push backend
          echo "uri=$image" >> "$GITHUB_OUTPUT"
      - name: Canary to every step
        run: infra/scripts/deploy.sh "${{ steps.image.outputs.uri }}" "${{ vars.NAME_PREFIX || 'docflow-demo' }}"
