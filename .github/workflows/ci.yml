name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: docflow
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/docflow
      REDIS_TEST_URL: redis://127.0.0.1:6379/14
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
      - run: uv sync --locked
      - name: Format and lint
        run: uv run ruff format --check . && uv run ruff check .
      - name: Type check (strict)
        run: uv run mypy .
      - name: No missing migrations
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Tests
        run: uv run pytest -rs
      - name: OpenAPI spec is up to date
        run: |
          uv run python manage.py spectacular --file /tmp/openapi.yaml --validate
          diff -u ../docs/openapi.yaml /tmp/openapi.yaml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: API types match the backend's spec
        run: npm run api:types && git diff --exit-code src/api/schema.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  aws:
    # The AWS side without an AWS account: Terraform checked and tested against a mocked provider,
    # the state machine run in Step Functions Local, and the Lambda image invoked locally.
    runs-on: ubuntu-latest
    services:
      stepfunctions:
        image: amazon/aws-stepfunctions-local:2.0.0
        ports: ["8083:8083"]
        env:
          SFN_MOCK_CONFIG: /mock/mock-config.json
        volumes:
          - ${{ github.workspace }}/infra/statemachine:/mock
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      REDIS_TEST_URL: redis://127.0.0.1:6379/14
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
      - uses: terraform-linters/setup-tflint@v4
      - name: Terraform format, validate, lint and test
        working-directory: infra
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
          tflint --init && tflint --format compact
          terraform test
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
      - name: State machine in Step Functions Local
        working-directory: backend
        env:
          SFN_LOCAL_URL: http://localhost:8083
        run: |
          docker restart ${{ job.services.stepfunctions.id }}  # the mock config is checked out after services start
          for i in $(seq 1 30); do curl -s localhost:8083 > /dev/null && break; sleep 1; done
          uv sync --locked
          uv run pytest -rs tests/test_state_machine.py
      - name: Lambda image runs a step
        run: |
          docker build -f backend/lambdas/Dockerfile -t docflow-pipeline backend
          docker run -d --name step -p 9000:8080 docflow-pipeline lambdas.handlers.prepare
          sleep 3
          reply=$(curl -s -X POST localhost:9000/2015-03-31/functions/function/invocations \
            -d '{"bucket": "docflow-documents", "key": "not/an/upload.png"}')
          echo "$reply"
          echo "$reply" | jq -e '.errorType == "UnsupportedFile"'

  stack:
    # The whole stack in Docker Compose, with an Ollama stand-in instead of model weights.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up --build -d
          for i in $(seq 1 60); do curl -fsS http://localhost:8000/ready > /dev/null 2>&1 && break; sleep 2; done
      - name: Smoke test
        run: |
          key=$(docker compose exec -T api python manage.py create_tenant "CI" | sed -n 's/^API key (shown once): //p')
          scripts/smoke-test.sh "$key"
      - name: Review app end to end (Playwright)
        working-directory: frontend
        run: |
          docker compose exec -T api python manage.py create_tenant "E2E" > /dev/null
          docker compose exec -T api python manage.py create_reviewer e2e admin --admin --password e2e-review-password
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/ > /dev/null 2>&1 && break; sleep 2; done
          npm ci && npx playwright install --with-deps chromium
          E2E_BASE_URL=http://localhost:8080 npx playwright test
      - name: Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results
          if-no-files-found: ignore
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --tail=80
