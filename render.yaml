# The public demo on Render's free plan: one web service, Postgres, and Key Value (Redis) for
# rate limits and the model-result cache.
# Deploy with https://render.com/deploy?repo=https://github.com/Shivasaireddy007/docflow-ai
services:
  - type: web
    name: docflow-demo
    runtime: docker
    plan: free
    dockerfilePath: deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: docflow-demo-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: docflow-demo-cache
          property: connectionString

  - type: keyvalue
    name: docflow-demo-cache
    plan: free
    ipAllowList: []  # reachable only from Render's private network

databases:
  - name: docflow-demo-db
    plan: free
