# The public demo on Render's free plan: a single web service. PostgreSQL and Redis run inside
# its container, and every start loads the demo data afresh.
# Deploy with https://render.com/deploy?repo=https://github.com/Shivasaireddy007/docflow-ai
services:
  - type: web
    name: docflow-demo
    runtime: docker
    plan: free
    dockerfilePath: deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
