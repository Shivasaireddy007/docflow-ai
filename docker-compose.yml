# The whole pipeline except the models:  docker compose up --build -d
# Then create a tenant and a reviewer:
#   docker compose exec api python manage.py create_tenant "Acme"
#   docker compose exec api python manage.py create_reviewer acme asha --admin
#
# Review app at http://localhost:8080, API docs at http://localhost:8000/api/docs, storage
# console at http://localhost:9001. Ollama runs on the host (`ollama serve`), where it can use
# the Mac's GPU; Docker on macOS can't.

x-app: &app
  build: ./backend
  image: docflow-api
  environment:
    DATABASE_URL: postgresql://docflow:docflow@postgres:5432/docflow
    SECRET_KEY: ${SECRET_KEY:-local-development-only-not-secret}
    ALLOWED_HOSTS: localhost,127.0.0.1,api
    STORAGE_BACKEND: s3
    S3_BUCKET: docflow-documents
    S3_ENDPOINT_URL: http://storage:9000
    AWS_ACCESS_KEY_ID: docflow
    AWS_SECRET_ACCESS_KEY: docflow-secret
    AWS_DEFAULT_REGION: us-east-1
    OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    OCR_MODEL: ${OCR_MODEL:-qwen2.5vl:3b}
    EXTRACTION_MODEL: ${EXTRACTION_MODEL:-qwen2.5:7b}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: docflow
      POSTGRES_PASSWORD: docflow
      POSTGRES_DB: docflow
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docflow"]
      interval: 5s
      retries: 20

  storage:
    # RustFS: an S3-compatible server (MinIO no longer publishes images). Console on :9001.
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: docflow
      RUSTFS_SECRET_KEY: docflow-secret
    ports:
      - "9001:9001"
    volumes:
      - storage:/data

  migrate:
    <<: *app
    # Creates the bucket (waiting for the storage server to start), then migrates.
    command: ["sh", "-c", "python manage.py ensure_bucket && python manage.py migrate --noinput"]
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_started
    restart: "no"

  api:
    <<: *app
    ports:
      - "8000:8000"

  worker:
    <<: *app
    command: ["python", "manage.py", "run_worker"]

  web:
    build: ./frontend
    image: docflow-web
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres:
  storage:
